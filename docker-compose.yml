services:
  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: ./Dockerfile
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=Secret-keyyy
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - DATABASE_URL=sqlite:////app/data/chemezy.db
      - ALLOWED_ORIGINS=["http://localhost:3000","https://yourdomain.com"]
      - PUBCHEM_BASE_URL=https://pubchem.ncbi.nlm.nih.gov/rest/pug
      - PUBCHEM_TIMEOUT=10
      - APP_NAME=Chemezy Backend Engine
      - DEBUG=false
      - OPENAI_API_KEY=fastgpt-cCTUY9TZh1ZUAcNv2dCnnnyB6J8BuEyjqTveeB18ehkXNYq59LaFzwcZQ
      - OPENAI_API_BASE=https://cloud.fastgpt.io/api/v1
      - OPENAI_MODEL_NAME=gpt-4o-mini
    volumes:
      - ./backend/data:/app/data
    working_dir: /app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
